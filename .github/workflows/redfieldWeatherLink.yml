name: WeatherLink function and API

on:
  push:
    branches: [main]
    paths: [api/**, global.json, .github/workflows/redfieldWeatherLink.yml]
  pull_request:
    branches: [main]
    paths: [api/**, global.json, .github/workflows/redfieldWeatherLink.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: redfieldWeatherLink
  CONFIGURATION: Release
  WORKING_DIRECTORY: api/src/RedfieldWeather

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish Functions
        run: dotnet publish "$WORKING_DIRECTORY" --configuration "$CONFIGURATION" --output artifacts/functionapp -warnaserror
      - uses: actions/upload-artifact@v7
        with:
          name: functionapp
          path: artifacts/functionapp
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: functionapp
          path: artifacts/functionapp
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          publish-profile: ${{ secrets.redfieldWeatherLink_69CB }}
          package: artifacts/functionapp
