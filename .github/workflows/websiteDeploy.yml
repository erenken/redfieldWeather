name: Website Deploy

on:
  push:
    branches: [main]
    paths: [rw-app/**, global.json, .github/workflows/websiteDeploy.yml]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths: [rw-app/**, global.json, .github/workflows/websiteDeploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish Blazor WebAssembly
        run: dotnet publish rw-app/RedfieldWeather.App.csproj --configuration Release --output artifacts/website -warnaserror
      - name: Deploy prebuilt static assets
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_FLOWER_053A4890F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: artifacts/website/wwwroot
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: main

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_FLOWER_053A4890F }}
          action: close
